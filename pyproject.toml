[project]
name = "latest-softwares"
version = "1.0.0"
description = "每日自动抓取最新软件版本元数据，提供 Web 前端与 JSON API。"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "PyYAML>=6.0.3",
    "requests>=2.33.1",
    "Jinja2>=3.1.6",
    # 远程统计持久化(Turso/libSQL);仅在配置 TURSO_DATABASE_URL 时导入使用。
    "libsql>=0.1.11",
]

[tool.fastapi]
# FastAPI Cloud 自动检测入口；这里显式声明以确保正确
entrypoint = "main:app"

[tool.setuptools]
packages = ["app_core"]
py-modules = ["main", "app"]

[tool.ruff]
# ruff 0.16 起默认也会格式化 Markdown 里的代码块；docs/ 下多为历史计划文档，
# 保持与 0.15 一致只处理 Python 文件。
extend-exclude = ["*.md"]

[tool.ruff.lint]
# 显式固定规则集（= ruff 0.15 的默认值）。ruff 0.16 起默认启用更多规则，
# 不写死的话每次升级 ruff 都会突然冒出大量新告警；要扩规则请在这里有意识地加。
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["scripts/fetchers/base.py", "scripts/editions.py", "scripts/sync.py"]

[[tool.mypy.overrides]]
module = "scripts.fetchers.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "scripts.validate_config"
strict = false
disallow_any_generics = false
disallow_untyped_defs = false
warn_return_any = false
no_implicit_reexport = false
warn_unused_ignores = false
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "scripts.net"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests"
ignore_missing_imports = true
