name: Deploy CN to Aliyun

# 只部署成功同步运行的已验证产物；源码与两版前端/后端锁定同一 run-id。
# 手动运行选择 main 最近一次成功发布，应用代码变更统一先经过 sync.yml。

on:
  workflow_run:
    workflows: ["Sync Latest Software"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # 按 run-id 下载已验证产物

concurrency:
  group: deploy-cn-aliyun
  cancel-in-progress: false

jobs:
  deploy-cn:
    # 开关:仓库变量 DEPLOY_ENABLED=true 才部署。
    # 经 workflow_run 触发时,只在源工作流"成功"且"非 PR 触发"时才部署。
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve verified release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="$TRIGGER_RUN"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow sync.yml --branch main --status success --limit 30 --json databaseId,event --jq 'map(select(.event != "pull_request"))[0].databaseId')
          fi
          test -n "$RUN_ID" && test "$RUN_ID" != null
          SOURCE_SHA=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq 'select(.name == "Sync Latest Software" and .conclusion == "success" and .event != "pull_request") | .head_sha')
          test -n "$SOURCE_SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout verified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Download verified data
        uses: actions/download-artifact@v8
        with:
          name: validated-data
          path: data/
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
      - name: Download verified frontend
        uses: actions/download-artifact@v8
        with:
          name: dist-cn
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Validate deploy secrets
        env:
          ALIYUN_DEPLOY_KEY:  ${{ secrets.ALIYUN_DEPLOY_KEY }}
          ALIYUN_HOST:        ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER:        ${{ secrets.ALIYUN_USER }}
          ALIYUN_DEPLOY_PATH: ${{ secrets.ALIYUN_DEPLOY_PATH }}
        run: |
          missing=()
          [ -n "${ALIYUN_DEPLOY_KEY:-}" ] || missing+=("ALIYUN_DEPLOY_KEY")
          [ -n "${ALIYUN_HOST:-}" ] || missing+=("ALIYUN_HOST")
          [ -n "${ALIYUN_USER:-}" ] || missing+=("ALIYUN_USER")
          [ -n "${ALIYUN_DEPLOY_PATH:-}" ] || missing+=("ALIYUN_DEPLOY_PATH")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Setup SSH
        env:
          SSH_KEY:  ${{ secrets.ALIYUN_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
          SSH_PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Aliyun via rsync
        env:
          SSH_HOST:    ${{ secrets.ALIYUN_HOST }}
          SSH_USER:    ${{ secrets.ALIYUN_USER }}
          SSH_PORT:    ${{ secrets.ALIYUN_PORT }}
          DEPLOY_PATH: ${{ secrets.ALIYUN_DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Deploy API backend to Aliyun
        env:
          SSH_HOST:    ${{ secrets.ALIYUN_HOST }}
          SSH_USER:    ${{ secrets.ALIYUN_USER }}
          SSH_PORT:    ${{ secrets.ALIYUN_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new"
          # 同步后端代码和包数据
          rsync -avz --delete \
            -e "$SSH_CMD" \
            --exclude '__pycache__' --exclude '.venv' --exclude 'venv/' \
            --exclude 'tests/' --exclude 'web/' --exclude 'dist/' \
            --exclude '.github/' --exclude 'scripts/' --exclude '.fastapicloud/' \
            --exclude '.ruff_cache/' --exclude '.mypy_cache/' --exclude '.pytest_cache/' \
            ./ "$SSH_USER@$SSH_HOST:/opt/latest-softwares/"
          # 同步包数据到后端目录
          rsync -avz \
            -e "$SSH_CMD" \
            data/latest.json "$SSH_USER@$SSH_HOST:/opt/latest-softwares/data/"
          # 重启 API 服务
          $SSH_CMD "$SSH_USER@$SSH_HOST" "sudo systemctl restart latest-softwares-api"

      - name: Summary
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          echo "✅ 国内版已部署到 http://$SSH_HOST:8080/"
