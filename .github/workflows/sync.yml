name: Sync Latest Software

on:
  schedule:
    # 每 6 小时检查重要入口；普通软件按状态中的 next_attempt_at 增量抓取。
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '只同步指定软件 id（逗号分隔，留空=全部）。例：vscode,python'
        required: false
        default: ''
        type: string
      skip:
        description: '跳过指定软件 id（逗号分隔）。'
        required: false
        default: ''
        type: string
      allow_unverified_required:
        description: '仅本次人工批准：保留但禁用待核验重要软件入口（逗号分隔 id）'
        required: false
        default: ''
        type: string
      exception_reason:
        description: '发布例外的人工批准原因；有例外时必填'
        required: false
        default: ''
        type: string
  push:
    branches: [main, master]
    paths:
      - 'config/**'
      - 'main.py'
      - 'app.py'
      - 'deploy/**'
      - '.github/actions/**'
      - '.github/**'
      - 'packages/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.pre-commit-config.yaml'
      - 'scripts/**'
      - 'app_core/**'
      - 'tests/**'
      - 'README.template.md'
      - 'README_en.template.md'
      - 'web/**'
      - '.github/workflows/sync.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'config/**'
      - 'main.py'
      - 'app.py'
      - 'deploy/**'
      - '.github/actions/**'
      - '.github/**'
      - 'packages/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.pre-commit-config.yaml'
      - 'scripts/**'
      - 'app_core/**'
      - 'tests/**'
      - 'README.template.md'
      - 'README_en.template.md'
      - 'web/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: write   # 自动 commit 渲染结果回主分支

concurrency:
  group: sync-latest-software
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Job 0: 代码检查 —— PR / push / 人工运行，定时同步复用已检查的源码
  # ==========================================================================
  pr-checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Lint + test
        uses: ./.github/actions/python-lint-test

      - name: Check rendered README
        run: python scripts/render.py --check

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Build web (dist/)
        run: python scripts/build_web.py

  # ==========================================================================
  # Job 1: 计算分片矩阵
  #   读 packages/ 目录，输出 JSON 数组供 sync-shard 的 matrix 使用。
  # ==========================================================================
  generate-shards:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.partition.outputs.shards }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install pyyaml
        run: uv pip install --system "$(grep -i '^pyyaml==' requirements.txt)"

      - name: Compute partition
        id: partition
        env:
          SYNC_ONLY: ${{ inputs.only }}
          SYNC_SKIP: ${{ inputs.skip }}
        run: |
          SHARDS=$(python scripts/partition_ids.py 3 --only "$SYNC_ONLY" --skip "$SYNC_SKIP")
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "分片矩阵: $SHARDS"

  # ==========================================================================
  # Job 2: 并行 sync —— 每个分片独立运行 sync.py --only
  #   Windows runner 满足 Fido 平台检查要求。
  # ==========================================================================
  sync:
    needs: generate-shards
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.generate-shards.outputs.shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Restore GitHub API ETag cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/http
          key: github-etag-shard${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: github-etag-shard${{ strategy.job-index }}-

      - name: Sync shard
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_SOFTWARES_HTTP_CACHE: .cache/http/github-etag.json.gz
          SYNC_ONLY: ${{ inputs.only }}
          SYNC_SKIP: ${{ inputs.skip }}
          SHARD_IDS: ${{ matrix.shard }}
        run: |
          ARGS=()
          if [ -n "$SHARD_IDS" ]; then ARGS+=(--only "$SHARD_IDS"); fi
          python scripts/sync.py --due "${ARGS[@]}"

      - name: Save GitHub API ETag cache
        if: ${{ always() && hashFiles('.cache/http/github-etag.json.gz') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/http
          key: github-etag-shard${{ strategy.job-index }}-${{ github.run_id }}

      - name: Check sync failure rate
        continue-on-error: true
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/check_sync_health.py --max-fail-rate 0.10

      - name: Upload partial result
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ strategy.job-index }}
          path: data/latest.json
          retention-days: 1

  # ==========================================================================
  # Job 3: 合并候选；发布必须等待链接校验门禁
  # ==========================================================================
  sync-merge:
    needs: sync
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install Python dependencies
        run: |
          uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Download shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: /tmp/shards

      - name: Merge shard results
        env:
          SYNC_ONLY: ${{ inputs.only }}
          SYNC_SKIP: ${{ inputs.skip }}
        run: python scripts/merge_results.py --shards-dir /tmp/shards --only "$SYNC_ONLY" --skip "$SYNC_SKIP"

      - name: Re-validate latest.json schema
        run: python -m pytest tests/test_latest_json_schema.py -q

      - name: Upload candidate data artifact
        uses: actions/upload-artifact@v7
        with:
          name: candidate-data
          path: data/latest.json
          retention-days: 1

  # ==========================================================================
  # Job 4: 真实下载链接巡检
  # ==========================================================================
  link-check:
    needs: sync-merge
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Download candidate data artifact
        uses: actions/download-artifact@v8
        with:
          name: candidate-data
          path: data/

      - name: Restore link check history
        uses: actions/cache/restore@v6
        with:
          path: data/link-state.json
          key: link-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: link-state-

      - name: Validate links and write health report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_UNVERIFIED_REQUIRED: ${{ inputs.allow_unverified_required }}
          EXCEPTION_REASON: ${{ inputs.exception_reason }}
        run: |
          ARGS=()
          if [ -n "$ALLOW_UNVERIFIED_REQUIRED" ]; then
            ARGS+=(--allow-unverified-required "$ALLOW_UNVERIFIED_REQUIRED" --exception-reason "$EXCEPTION_REASON")
          fi
          python scripts/validate_links.py --gate "${ARGS[@]}"

      - name: Save link check history
        if: ${{ always() && hashFiles('data/link-state.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: data/link-state.json
          key: link-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Write link health summary
        if: ${{ always() }}
        run: python scripts/link_health_summary.py data/link-health.json

      - name: Upload link health artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: link-health
          path: |
            data/link-health.json
            data/coverage-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validated data artifact
        uses: actions/upload-artifact@v7
        with:
          name: validated-data
          path: |
            data/latest.json
            data/link-state.json
            data/link-health.json
            data/coverage-report.json
          retention-days: 30

  publish:
    needs: [link-check, pr-checks]
    if: >-
      !cancelled() && needs.link-check.result == 'success' &&
      (needs.pr-checks.result == 'success' ||
       (github.event_name == 'schedule' && needs.pr-checks.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt
      - run: uv pip install --system -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: validated-data
          path: data/
      - name: Render verified snapshot
        run: |
          python scripts/render.py
          python scripts/render.py --check
      - name: Build both editions from verified snapshot
        env:
          CN_PUBLIC_SITE_URL: ${{ vars.CN_PUBLIC_SITE_URL }}
        run: |
          python scripts/build_web.py --edition cn
          mv dist dist-cn
          python scripts/build_web.py --edition intl
          mv dist dist-intl
      - name: Commit verified snapshot
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.ref_name }}
          commit_message: 'chore(data): publish verified software snapshot [skip ci]'
          file_pattern: 'data/latest.json data/link-state.json data/coverage-report.json README.md README_en.md'
      - uses: actions/upload-artifact@v7
        with:
          name: dist-cn
          path: dist-cn/
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: dist-intl
          path: dist-intl/
          retention-days: 30
