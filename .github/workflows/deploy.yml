name: Deploy Intl to FastAPI Cloud

# 只部署成功同步运行的已验证产物；源码与两版前端/后端锁定同一 run-id。
# 手动运行选择 main 最近一次成功发布，应用代码变更统一先经过 sync.yml。

on:
  workflow_run:
    workflows: ["Sync Latest Software"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-intl-fastapi-cloud
  cancel-in-progress: false

jobs:
  deploy-intl:
    # 开关:仓库变量 DEPLOY_INTL_ENABLED=true 才部署。
    # 经由 workflow_run 触发时,只在源工作流"成功"且"非 PR 触发"时才部署。
    if: >-
      vars.DEPLOY_INTL_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve verified release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          RUN_ID="$TRIGGER_RUN"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow sync.yml --branch main --status success --limit 30 --json databaseId,event --jq 'map(select(.event != "pull_request"))[0].databaseId')
          fi
          test -n "$RUN_ID" && test "$RUN_ID" != null
          SOURCE_SHA=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq 'select(.name == "Sync Latest Software" and .conclusion == "success" and .event != "pull_request") | .head_sha')
          test -n "$SOURCE_SHA"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout verified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
      - name: Download verified data
        uses: actions/download-artifact@v8
        with:
          name: validated-data
          path: data/
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}
      - name: Download verified frontend
        uses: actions/download-artifact@v8
        with:
          name: dist-intl
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Fetch current metrics from live instance
        env:
          METRICS_URL: "https://latest-softwares-064facea.fastapicloud.dev/api/metrics"
        run: |
          HTTP_CODE=$(curl -sSL -o data/site_metrics.json -w '%{http_code}' --max-time 15 "$METRICS_URL" || echo "000")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Metrics fetched (HTTP $HTTP_CODE)"
          else
            echo "Metrics fetch failed (HTTP $HTTP_CODE), using repo copy"
            rm -f data/site_metrics.json
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install Python dependencies
        run: uv pip install --system -r requirements.txt

      - name: Deploy to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: fastapi deploy

      - name: Summary
        run: |
          echo "✅ 国际版已部署到 FastAPI Cloud"
