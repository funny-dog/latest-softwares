name: Discover popular software

on:
  schedule:
    # 每周扫描，单源游标和全局候选上限控制预算。
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore discovery progress
        uses: actions/cache/restore@v5
        with:
          path: data/discovery-state.json
          key: discovery-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discovery-state-

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.discover --sources github winget brew scoop --max-output 30 --output packages/shared.yaml --new-ids-file discover_new_ids.txt

      - name: Save discovery progress
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: data/discovery-state.json
          key: discovery-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload candidate review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: discovery-review
          path: data/discovery-candidates.json
          retention-days: 30

      - name: Validate config
        run: python scripts/validate_config.py

      - name: Dry-run sync for new ids
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS=$(tr '\n' ',' < discover_new_ids.txt | sed 's/,$//')
          if [ -n "$IDS" ]; then
            # dry-run 仅为在日志中暴露新条目的 fetcher 能否解析；
            # || true 不让其阻断 PR（validate_config 才是硬门槛）。
            python -m scripts.sync --only "$IDS" || true
          else
            echo "无新候选，跳过 dry-run"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          # 只提交 shared.yaml：dry-run 改动的 data/latest.json 与临时
          # discover_new_ids.txt 都不会进 PR，保证纯追加干净 diff。
          add-paths: packages/shared.yaml
          branch: auto/discover
          delete-branch: true
          title: "chore(discover): 自动发现的热门软件候选"
          commit-message: "chore(discover): 自动发现热门软件候选（待人工 review）"
          body: |
            本 PR 由 discover workflow 自动生成。

            请 review：
            - [ ] 核对每条 `desc_cn`（自动翻译，可能需润色）
            - [ ] 确认 `category` 合理
            - [ ] 如不适合国内版，把 `editions` 从 `[cn, intl]` 改为 `[intl]`
            - [ ] 核对 source_ids、provider/package 和平台；GitHub pattern 必须唯一命中
            - [ ] 检查 discovery-review artifact 中的来源证据和冲突，候选尚未通过发布链接验证
        # 无变更时该 action 不会开 PR；游标缓存与审查产物独立保存。
