# Dependabot 配置 —— 自动监控依赖升级与安全补丁
#
# 覆盖三个生态：
#   1. pip            —— requirements.txt + requirements-dev.txt（项目根目录）
#   2. npm            —— package.json + package-lock.json（改进项 6 esbuild 构建链引入）
#   3. github-actions —— workflows 中的 action（含第三方 dawidd6 / stefanzweifel）
#
# 策略（每月一次，降低噪音；安全更新需在仓库设置开启 Dependabot security updates，
# 它不受这里的 schedule 限制）：
#   - pip / npm / github-actions：minor + patch 分组成单个 PR（通过 pr-checks 后可自动
#     合并）；major 单独开 PR（便于人工审查破坏性变更或未覆盖到的 deploy/discover workflow）。
version: 2
updates:
  # ---- Python 依赖 ----
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # major 版本不分组：fastapi / pydantic 等的 major 升级可能含破坏性变更，单独 PR 审查。

  # ---- 前端构建工具（esbuild）----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
